name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # TODO: 필요시 Gitleaks 주석 해제, 조직에 편입됨에 따라 라이선스 키 필요
